# ── Experiment ───────────────────────────────────────────────────────────────
name = "aodnet_capa_v3_multidomain"

# ── Dataset ─────────────────────────────────────────────────────────────────
[datasets.train]
hazy_dir = 'F:\Projects\AI Computer Vision\Dataset\MergedDataset\hazy'
clear_dir = 'F:\Projects\AI Computer Vision\Dataset\MergedDataset\clear'
pairing_strategy = "reside"
patch_size = 128
batch_size = 10
num_workers = 4
augmentation = ["hflip", "vflip"]
domain_balanced_sampling = true  # ensure minority domains get fair training

[datasets.val]
hazy_dir = 'F:\Projects\AI Computer Vision\Validation\hazy'
clear_dir = 'F:\Projects\AI Computer Vision\Validation\clear'
pairing_strategy = "reside"
patch_size = 128

# ── Model ────────────────────────────────────────────────────────────────────
[network]
type = "aodnet_capa"
channels = 96             # backbone width — increased for multi-domain capacity
num_fa_blocks = 3         # stacked FA blocks — progressive attention refinement
refine_channels = 32      # color refinement tail hidden width
# AOD-CA-PA-Net v3: reflection padding + stacked FA + color refinement tail.
# Designed for multi-domain training (RESIDE + O-Haze + NH-Haze + 3R).

# ── Physical Model ───────────────────────────────────────────────────────────
# Not used directly (AOD-CA-PA-Net uses K(x) formulation), kept for reference.
[physics]
dark_channel_window = 15
atm_light_top_percent = 0.01
t_min = 0.2

# ── Training ─────────────────────────────────────────────────────────────────
[train]
epochs = 300
loss_type = "mixed"
grad_clip = true
grad_clip_value = 1.0

[train.mixed_loss_weights]
# Core pixel fidelity
l1 = 1.0
# Structural similarity — strongest perceptual quality driver
ssim = 0.8
# Edge-preserving: reduced since no halos observed, free up gradient budget
sobel = 0.2
laplacian = 0.1
# Physics regularizer: penalizes residual haze in dark channels
dcp = 0.01
# VGG feature-level similarity — boosted for vivid, natural appearance
perceptual = 0.3
# Per-channel color consistency — boosted to fight desaturation
color = 0.5

[train.optimizer]
type = "adam"
lr = 1e-4
weight_decay = 0.0
betas = [0.9, 0.999]

[train.scheduler]
type = "cosine"
T_max = 300    # match total epochs — single smooth cosine decay, no restarts
eta_min = 1e-7

# ── Validation ───────────────────────────────────────────────────────────────
[val]
val_freq = 1
metrics = ["psnr", "ssim"]

# ── Logging ──────────────────────────────────────────────────────────────────
[logger]
print_freq = 50
save_checkpoint_freq = 5
save_dir = "./experiments"
