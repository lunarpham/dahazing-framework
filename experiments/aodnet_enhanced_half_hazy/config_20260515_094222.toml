# ── Experiment ───────────────────────────────────────────────────────────────
name = "aodnet_enhanced_half_hazy"

# ── Dataset ─────────────────────────────────────────────────────────────────
[datasets.train]
hazy_dir = 'E:\Documents\Computer Vision Learning\Dataset\ots\ots_half_hazy'
clear_dir = 'E:\Documents\Computer Vision Learning\Dataset\ots\ots_clear'
pairing_strategy = "reside"
patch_size = 256
batch_size = 6
num_workers = 4
augmentation = ["hflip", "vflip"]

[datasets.val]
hazy_dir = 'E:\Documents\Computer Vision Learning\Dataset\Validation\hazy'
clear_dir = 'E:\Documents\Computer Vision Learning\Dataset\Validation\gt'
pairing_strategy = "reside"
patch_size = 256

# ── Model ────────────────────────────────────────────────────────────────────
[network]
type = "aodnet_enhanced"
# Finetuning from previous best model
pretrained_weights = "experiments/aodnet_enhanced_reside_its/checkpoints/best.pth"

# ── Physical Model ───────────────────────────────────────────────────────────
[physics]
dark_channel_window = 15
atm_light_top_percent = 0.01
t_min = 0.2

# ── Training ─────────────────────────────────────────────────────────────────
[train]
epochs = 100 # Reduced epochs for fine-tuning
loss_type = "mixed"
grad_clip = true
grad_clip_value = 1.0

[train.mixed_loss_weights]
l1 = 1.0             
ssim = 0.1            
perceptual = 0.1      
dcp = 0.01            

[train.optimizer]
type = "adam"
lr = 1e-5 # Lowered learning rate for fine-tuning (was 1e-4)
weight_decay = 0.0
betas = [0.9, 0.999]

[train.scheduler]
type = "cosine"
T_max = 50
eta_min = 1e-7

# ── Validation ───────────────────────────────────────────────────────────────
[val]
val_freq = 1
metrics = ["psnr", "ssim"]

# ── Logging ──────────────────────────────────────────────────────────────────
[logger]
print_freq = 50
save_checkpoint_freq = 5
save_dir = "./experiments"
