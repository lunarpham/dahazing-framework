# ── Experiment ───────────────────────────────────────────────────────────────
name = "aodnet_enhanced_reside_its"

# ── Dataset ─────────────────────────────────────────────────────────────────
[datasets.train]
hazy_dir = 'E:\Documents\Computer Vision Learning\Dataset\Merged Pack\hazy'
clear_dir = 'E:\Documents\Computer Vision Learning\Dataset\Merged Pack\clear'
pairing_strategy = "reside"
patch_size = 256
batch_size = 8
num_workers = 4
augmentation = ["hflip", "vflip"]

[datasets.val]
hazy_dir = 'E:\Documents\Computer Vision Learning\Dataset\Validation\hazy'
clear_dir = 'E:\Documents\Computer Vision Learning\Dataset\Validation\gt'
pairing_strategy = "reside"
patch_size = 256

# ── Model ────────────────────────────────────────────────────────────────────
[network]
type = "aodnet_enhanced"
# Enhanced AOD-Net: deeper multi-scale + SE features predicting K(x).
# Same stable K(x) recovery as AOD-Net, but with ~770K params for
# greater capacity. Best of both worlds.

# ── Physical Model ───────────────────────────────────────────────────────────
# Not used directly, kept for reference.
[physics]
dark_channel_window = 15
atm_light_top_percent = 0.01
t_min = 0.2

# ── Training ─────────────────────────────────────────────────────────────────
[train]
epochs = 300
loss_type = "mixed"
grad_clip = true
grad_clip_value = 1.0

[train.mixed_loss_weights]
l1 = 1.0             # Sharp pixel-level reconstruction
ssim = 0.1            # Structural similarity
perceptual = 0.1      # VGG perceptual quality
dcp = 0.01            # Dark Channel Prior physics regularizer

[train.optimizer]
type = "adam"
lr = 1e-4
weight_decay = 0.0
betas = [0.9, 0.999]

[train.scheduler]
type = "cosine"
T_max = 100
eta_min = 1e-7

# ── Validation ───────────────────────────────────────────────────────────────
[val]
val_freq = 1
metrics = ["psnr", "ssim"]

# ── Logging ──────────────────────────────────────────────────────────────────
[logger]
print_freq = 50
save_checkpoint_freq = 5
save_dir = "./experiments"
