# ── Experiment ───────────────────────────────────────────────────────────────
name = "aodnet_pa_reside_its"

# ── Dataset ─────────────────────────────────────────────────────────────────
[datasets.train]
hazy_dir = 'F:\Projects\AI Computer Vision\Dataset\Merged Pack\hazy'
clear_dir = 'F:\Projects\AI Computer Vision\Dataset\Merged Pack\clear'
pairing_strategy = "reside"
patch_size = 256
batch_size = 10
num_workers = 4
augmentation = ["hflip", "vflip"]

[datasets.val]
hazy_dir = 'F:\Projects\AI Computer Vision\Dataset\Validation\hazy'
clear_dir = 'F:\Projects\AI Computer Vision\Dataset\Validation\gt'
pairing_strategy = "reside"
patch_size = 256

# ── Model ────────────────────────────────────────────────────────────────────
[network]
type = "aodnet_pa"
# AOD-PA-Net: AOD-Net backbone + Pixel Attention for depth-aware dehazing.
# The PA block learns a spatial attention map that suppresses halos in clear
# foreground regions while enabling full correction in dense haze areas.
# Extremely lightweight (~2.1K params) with spatially-adaptive dehazing.

# ── Physical Model ───────────────────────────────────────────────────────────
# Not used directly (AOD-PA-Net uses K(x) formulation), kept for reference.
[physics]
dark_channel_window = 15
atm_light_top_percent = 0.01
t_min = 0.2

# ── Training ─────────────────────────────────────────────────────────────────
[train]
epochs = 300
loss_type = "mixed"
grad_clip = true
grad_clip_value = 1.0

[train.mixed_loss_weights]
l1 = 1.0             # Sharp pixel-level reconstruction
ssim = 0.1            # Structural similarity
perceptual = 0.1      # VGG perceptual quality
dcp = 0.01            # Dark Channel Prior physics regularizer

[train.optimizer]
type = "adam"
lr = 1e-4
weight_decay = 0.0
betas = [0.9, 0.999]

[train.scheduler]
type = "cosine"
T_max = 100
eta_min = 1e-7

# ── Validation ───────────────────────────────────────────────────────────────
[val]
val_freq = 1
metrics = ["psnr", "ssim"]

# ── Logging ──────────────────────────────────────────────────────────────────
[logger]
print_freq = 50
save_checkpoint_freq = 5
save_dir = "./experiments"
