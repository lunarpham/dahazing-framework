# ── Experiment ───────────────────────────────────────────────────────────────
name = "dcpnet_multidomain"

# ── Dataset ─────────────────────────────────────────────────────────────────
[datasets.train]
hazy_dir = 'F:\Projects\AI Computer Vision\Dataset\OutdoorTrainingSet\hazy'
clear_dir = 'F:\Projects\AI Computer Vision\Dataset\OutdoorTrainingSet\clear'
pairing_strategy = "reside"
patch_size = 256
batch_size = 10              # very small model → large batch
num_workers = 4
augmentation = ["hflip", "vflip"]
domain_balanced_sampling = true

[datasets.val]
hazy_dir = 'F:\Projects\AI Computer Vision\Validation\hazy'
clear_dir = 'F:\Projects\AI Computer Vision\Validation\clear'
pairing_strategy = "reside"
patch_size = 256

# ── Model ────────────────────────────────────────────────────────────────────
[network]
type = "dcpnet"
omega = 0.95
t_min = 0.1
dcp_window = 15
refine_channels = 64
# DCP-Net: Physics-guided with learned edge + sky awareness.
# Only ~5K learnable params — DCP handles the heavy lifting.

# ── Physical Model ───────────────────────────────────────────────────────────
# Handled internally by DCPNet — these are for fallback/reference only.
[physics]
dark_channel_window = 15
atm_light_top_percent = 0.01
t_min = 0.1

# ── Training ─────────────────────────────────────────────────────────────────
[train]
epochs = 300
loss_type = "mixed"
grad_clip = true
grad_clip_value = 1.0
# Weight for auxiliary edge/sky supervision loss
aux_loss_weight = 0.1

[train.mixed_loss_weights]
l1 = 1.0
ssim = 0.5
# Edge preservation — important for halo prevention
sobel = 0.5
# Color consistency — important for sky regions
color = 0.3

[train.optimizer]
type = "adamw"
lr = 1e-4                   # higher LR ok for tiny model
weight_decay = 0.0
betas = [0.9, 0.999]

[train.scheduler]
type = "cosine"
T_max = 300
eta_min = 1e-6

# ── Validation ───────────────────────────────────────────────────────────────
[val]
val_freq = 1
metrics = ["psnr", "ssim"]

# ── Logging ──────────────────────────────────────────────────────────────────
[logger]
print_freq = 50
save_checkpoint_freq = 1
save_dir = "./experiments"
