# ── Experiment ───────────────────────────────────────────────────────────────
name = "msfa_denet_v2_multidomain"

# ── Dataset ─────────────────────────────────────────────────────────────────
[datasets.train]
hazy_dir = 'F:\Projects\AI Computer Vision\Dataset\ots\ots_hazy'
clear_dir = 'F:\Projects\AI Computer Vision\Dataset\ots\ots_clear'
pairing_strategy = "reside"
patch_size = 256
batch_size = 6               # slightly smaller due to 3-scale pyramid
num_workers = 4
augmentation = ["hflip", "vflip"]
domain_balanced_sampling = true

[datasets.val]
hazy_dir = 'F:\Projects\AI Computer Vision\Validation\hazy'
clear_dir = 'F:\Projects\AI Computer Vision\Validation\clear'
pairing_strategy = "reside"
patch_size = 256

# ── Model ────────────────────────────────────────────────────────────────────
[network]
type = "msfa_denet_v2"
channels = 64              # backbone width
# MSFADeNetV2: Enhanced Multi-Scale Feature Attention Dehazing Network
# Improvements: no normalization, depthwise-separable ConvBlock with SE,
# 3-scale pyramid (full/½/¼), transmission-aware attention,
# per-channel residual scale, pixel shuffle upsampling.

# ── Physical Model ───────────────────────────────────────────────────────────
# Not used directly (MSFA-DeNet v2 uses direct residual prediction).
[physics]
dark_channel_window = 15
atm_light_top_percent = 0.01
t_min = 0.2

# ── Training ─────────────────────────────────────────────────────────────────
[train]
epochs = 100
loss_type = "mixed"
grad_clip = true
grad_clip_value = 1.0

[train.mixed_loss_weights]
l1 = 1.0
ssim = 0.4
perceptual = 0.3
fft = 0.1

[train.optimizer]
type = "adamw"
lr = 2e-4
weight_decay = 1e-4
betas = [0.9, 0.999]

[train.scheduler]
type = "cosine"
T_max = 100
eta_min = 1e-6

# ── Validation ───────────────────────────────────────────────────────────────
[val]
val_freq = 1
metrics = ["psnr", "ssim"]

# ── Logging ──────────────────────────────────────────────────────────────────
[logger]
print_freq = 50
save_checkpoint_freq = 1
save_dir = "./experiments"
