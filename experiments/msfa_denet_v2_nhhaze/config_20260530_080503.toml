# ── Experiment ───────────────────────────────────────────────────────────────
name = "msfa_denet_v2_nhhaze"

# ── Dataset ─────────────────────────────────────────────────────────────────
[datasets.train]
hazy_dir = 'F:\Projects\AI Computer Vision\Dataset\NH-Haze\NH-HAZE\train\hazy'
clear_dir = 'F:\Projects\AI Computer Vision\Dataset\NH-Haze\NH-HAZE\train\clear'
pairing_strategy = "reside"
patch_size = 256
batch_size = 4
num_workers = 4
augmentation = ["hflip", "vflip"]
domain_balanced_sampling = true

[datasets.val]
hazy_dir = 'F:\Projects\AI Computer Vision\Dataset\O-Haze\O-HAZY\hazy'
clear_dir = 'F:\Projects\AI Computer Vision\Dataset\O-Haze\O-HAZY\GT'
pairing_strategy = "reside"
patch_size = 256

# ── Model ────────────────────────────────────────────────────────────────────
[network]
type = "msfa_denet_v2"
channels = 64

[path]
pretrain = 'F:\Projects\AI Computer Vision\dahazing-framework\experiments\msfa_denet_v2_multidomain\checkpoints\epoch_99.pth'

# ── Physical Model ───────────────────────────────────────────────────────────
# Not used directly (MSFA-DeNet v2 uses direct residual prediction).
[physics]
dark_channel_window = 15
atm_light_top_percent = 0.01
t_min = 0.2

# ── Training ─────────────────────────────────────────────────────────────────
[train]
epochs = 100
loss_type = "mixed"
grad_clip = true
grad_clip_value = 1.0

[train.mixed_loss_weights]
l1 = 1.0
ssim = 0.4
perceptual = 0.3
fft = 0.1

[train.optimizer]
type = "adamw"
lr = 1e-5
weight_decay = 1e-4
betas = [0.9, 0.999]

[train.scheduler]
type = "cosine"
T_max = 100
eta_min = 1e-8

# ── Validation ───────────────────────────────────────────────────────────────
[val]
val_freq = 5
metrics = ["psnr", "ssim"]

# ── Logging ──────────────────────────────────────────────────────────────────
[logger]
print_freq = 50
save_checkpoint_freq = 5
save_dir = "./experiments"
