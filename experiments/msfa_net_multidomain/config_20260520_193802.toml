# ── Experiment ───────────────────────────────────────────────────────────────
name = "msfa_net_multidomain"

# ── Dataset ─────────────────────────────────────────────────────────────────
[datasets.train]
hazy_dir = 'F:\Projects\AI Computer Vision\Dataset\OutdoorTrainingSet\hazy'
clear_dir = 'F:\Projects\AI Computer Vision\Dataset\OutdoorTrainingSet\clear'
pairing_strategy = "reside"
patch_size = 128
batch_size = 15               # slightly smaller than AOD due to larger model
num_workers = 4
augmentation = ["hflip", "vflip"]
domain_balanced_sampling = true

[datasets.val]
hazy_dir = 'F:\Projects\AI Computer Vision\Validation\hazy'
clear_dir = 'F:\Projects\AI Computer Vision\Validation\clear'
pairing_strategy = "reside"
patch_size = 256

# ── Model ────────────────────────────────────────────────────────────────────
[network]
type = "msfa_net"
channels = 64              # backbone width
num_fa = 2                 # FA blocks per encoder/decoder level
num_dense_layers = 3       # conv layers per DenseBlock
# MSFA-Net: Multi-Scale Feature Attention Network
# Combines MSBDN encoder-decoder with FFA-Net CA→PA attention.
# Global residual learning: clean = hazy + residual.

# ── Physical Model ───────────────────────────────────────────────────────────
# Not used directly (MSFA-Net uses direct residual prediction).
[physics]
dark_channel_window = 15
atm_light_top_percent = 0.01
t_min = 0.2

# ── Training ─────────────────────────────────────────────────────────────────
[train]
epochs = 300
loss_type = "mixed"
grad_clip = true
grad_clip_value = 1.0

[train.mixed_loss_weights]
# Core pixel fidelity
l1 = 1.0
# Structural similarity — strongest perceptual quality driver
ssim = 0.8
# Edge-preserving: light regularization
sobel = 0.2
laplacian = 0.1
# Physics regularizer: penalizes residual haze in dark channels
dcp = 0.01
# VGG feature-level similarity — vivid, natural appearance
perceptual = 0.3
# Per-channel color consistency
color = 0.5

[train.optimizer]
type = "adam"
lr = 5e-5
weight_decay = 0.0
betas = [0.9, 0.999]

[train.scheduler]
type = "cosine"
T_max = 300
eta_min = 1e-7

# ── Validation ───────────────────────────────────────────────────────────────
[val]
val_freq = 1
metrics = ["psnr", "ssim"]

# ── Logging ──────────────────────────────────────────────────────────────────
[logger]
print_freq = 50
save_checkpoint_freq = 5
save_dir = "./experiments"
