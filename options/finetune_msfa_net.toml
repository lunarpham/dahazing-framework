# ── Experiment ───────────────────────────────────────────────────────────────
# Fine-tune on real-world haze (O-Haze + NH-Haze + Dense-Haze)
# to improve generalization on out-of-distribution dense haze.
name = "msfa_net_finetune_realhaze"

# ── Dataset ─────────────────────────────────────────────────────────────────
# Combined real haze data — all use RESIDE naming (XXXX_suffix.ext)
[datasets.train]
hazy_dir = 'F:\Projects\AI Computer Vision\Dataset\MergedDataset\dense-hazy'
clear_dir = 'F:\Projects\AI Computer Vision\Dataset\MergedDataset\dense-clear'
pairing_strategy = "reside"
patch_size = 128
batch_size = 8
num_workers = 4
augmentation = ["hflip", "vflip"]
domain_balanced_sampling = true

[datasets.val]
hazy_dir = 'F:\Projects\AI Computer Vision\Dataset\NH-Haze\NH-HAZE\test\hazy'
clear_dir = 'F:\Projects\AI Computer Vision\Dataset\NH-Haze\NH-HAZE\test\clear'
pairing_strategy = "reside"
patch_size = 256

# ── Model ────────────────────────────────────────────────────────────────────
[network]
type = "msfa_net"
channels = 64
num_fa = 2
num_dense_layers = 3

# ── Pretrained Weights ───────────────────────────────────────────────────────
# Load best checkpoint from initial training, fine-tune from there.
[path]
pretrain = "./experiments/msfa_net_multidomain/checkpoints/best.pth"

# ── Physical Model ───────────────────────────────────────────────────────────
[physics]
dark_channel_window = 15
atm_light_top_percent = 0.01
t_min = 0.2

# ── Training ─────────────────────────────────────────────────────────────────
[train]
epochs = 100                 # shorter — fine-tuning converges faster
loss_type = "mixed"
grad_clip = true
grad_clip_value = 1.0

[train.mixed_loss_weights]
l1 = 1.0
ssim = 0.8
sobel = 0.2
laplacian = 0.1
dcp = 0.01
perceptual = 0.3
color = 0.5

[train.optimizer]
type = "adam"
lr = 1e-5                   # 5× lower than initial training for fine-tuning
weight_decay = 0.0
betas = [0.9, 0.999]

[train.scheduler]
type = "cosine"
T_max = 100
eta_min = 1e-8

# ── Validation ───────────────────────────────────────────────────────────────
[val]
val_freq = 1
metrics = ["psnr", "ssim"]

# ── Logging ──────────────────────────────────────────────────────────────────
[logger]
print_freq = 50
save_checkpoint_freq = 5
save_dir = "./experiments"
