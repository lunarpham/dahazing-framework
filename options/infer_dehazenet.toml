# ── Experiment ───────────────────────────────────────────────────────────────
name = "dehazenet_reside_v1"

# ── Model ────────────────────────────────────────────────────────────────────
[network]
type = "dehazenet"

# ── Physical Model (DCP + Koschmieder) ───────────────────────────────────────
[physics]
dark_channel_window = 15
atm_light_top_percent = 0.001
t_min = 0.1

# ── Paths ────────────────────────────────────────────────────────────────────
[path]
model_path = "experiments/dehazenet_reside_v1/checkpoints/best.pth"
input = "test_images/"               # single image path or directory
output = "results/"
