# ── Experiment ───────────────────────────────────────────────────────────────
name = "aodnet_reside_its"

# ── Dataset ─────────────────────────────────────────────────────────────────
[datasets.train]
hazy_dir = 'E:\Documents\Computer Vision Learning\Dataset\hazy'
clear_dir = 'E:\Documents\Computer Vision Learning\Dataset\clear'
pairing_strategy = "reside"
patch_size = 128
batch_size = 16       # AOD-Net is tiny, can use larger batches
num_workers = 4
augmentation = ["hflip", "vflip"]

[datasets.val]
hazy_dir = 'E:\Documents\Computer Vision Learning\Image Dehazing Traditional\validation\hazy'
clear_dir = 'E:\Documents\Computer Vision Learning\Image Dehazing Traditional\validation\clear'
pairing_strategy = "reside"
patch_size = 256

# ── Model ────────────────────────────────────────────────────────────────────
[network]
type = "aodnet"
# Standard AOD-Net: predicts unified K(x) parameter.
# J(x) = K(x)*I(x) - K(x) + 1  (no division by t(x))
# Only ~1.9K parameters — extremely lightweight.

# ── Physical Model ───────────────────────────────────────────────────────────
# Not used directly (AOD-Net is end-to-end), kept for reference.
[physics]
dark_channel_window = 15
atm_light_top_percent = 0.01
t_min = 0.2

# ── Training ─────────────────────────────────────────────────────────────────
[train]
epochs = 100
loss_type = "mse"     # AOD-Net paper uses MSE
grad_clip = false

[train.optimizer]
type = "adam"
lr = 1e-4
weight_decay = 1e-4   # Per AOD-Net paper
betas = [0.9, 0.999]

[train.scheduler]
type = "cosine"
T_max = 100
eta_min = 1e-7

# ── Validation ───────────────────────────────────────────────────────────────
[val]
val_freq = 1
metrics = ["psnr", "ssim"]

# ── Logging ──────────────────────────────────────────────────────────────────
[logger]
print_freq = 50
save_checkpoint_freq = 5
save_dir = "./experiments"
