# ── Experiment ───────────────────────────────────────────────────────────────
name = "dehazenet_reside_its"

# ── Dataset ─────────────────────────────────────────────────────────────────
[datasets.train]
hazy_dir = 'E:\Documents\Computer Vision Learning\Dataset\hazy'
clear_dir = 'E:\Documents\Computer Vision Learning\Dataset\clear'
pairing_strategy = "reside"
patch_size = 128
batch_size = 8
num_workers = 4
augmentation = ["hflip", "vflip"]

[datasets.val]
hazy_dir = 'E:\Documents\Computer Vision Learning\Image Dehazing Traditional\validation\hazy'
clear_dir = 'E:\Documents\Computer Vision Learning\Image Dehazing Traditional\validation\clear'
pairing_strategy = "reside"
patch_size = 256

# ── Model ────────────────────────────────────────────────────────────────────
[network]
type = "dehazenet"

# ── Physical Model ───────────────────────────────────────────────────────────
[physics]
dark_channel_window = 15
atm_light_top_percent = 0.001
t_min = 0.1

# ── Training ─────────────────────────────────────────────────────────────────
[train]
epochs = 50
loss_type = "mse"
grad_clip = false

[train.optimizer]
type = "adam"
lr = 1e-4
weight_decay = 0.0
betas = [0.9, 0.999]

[train.scheduler]
type = "cosine"
T_max = 50
eta_min = 1e-7

# ── Validation ───────────────────────────────────────────────────────────────
[val]
val_freq = 1
metrics = ["psnr", "ssim"]

# ── Logging ──────────────────────────────────────────────────────────────────
[logger]
print_freq = 50
save_checkpoint_freq = 5
save_dir = "./experiments"
