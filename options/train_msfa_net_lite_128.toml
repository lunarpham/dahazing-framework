# ── Experiment ───────────────────────────────────────────────────────────────
name = "msfa_net_lite_128"

# ── Dataset ─────────────────────────────────────────────────────────────────
[datasets.train]
hazy_dir = 'F:\Projects\AI Computer Vision\Dataset\MergedDataset\hazy'
clear_dir = 'F:\Projects\AI Computer Vision\Dataset\MergedDataset\clear'
pairing_strategy = "reside"
patch_size = 256
batch_size = 10
num_workers = 4
augmentation = ["hflip", "vflip"]
domain_balanced_sampling = true

[datasets.val]
hazy_dir = 'F:\Projects\AI Computer Vision\Validation\hazy'
clear_dir = 'F:\Projects\AI Computer Vision\Validation\clear'
pairing_strategy = "reside"
patch_size = 256

# ── Model ────────────────────────────────────────────────────────────────────
[network]
type = "msfa_net_lite"
channels = 128

# ── Physical Model ───────────────────────────────────────────────────────────
[physics]
dark_channel_window = 15
atm_light_top_percent = 0.01
t_min = 0.2

# ── Training ─────────────────────────────────────────────────────────────────
[train]
epochs = 300
loss_type = "mixed"
grad_clip = true
grad_clip_value = 1.0

[train.mixed_loss_weights]
l1 = 1.0
ssim = 0.5
perceptual = 0.1
color = 0.3
contrastive = 0.2

[train.optimizer]
type = "adam"
lr = 1e-4
weight_decay = 0.0
betas = [0.9, 0.999]

[train.scheduler]
type = "cosine"
T_max = 300
eta_min = 1e-7

# ── Validation ───────────────────────────────────────────────────────────────
[val]
val_freq = 1
metrics = ["psnr", "ssim"]

# ── Logging ──────────────────────────────────────────────────────────────────
[logger]
print_freq = 50
save_checkpoint_freq = 1
save_dir = "./experiments"
